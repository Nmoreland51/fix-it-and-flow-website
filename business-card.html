<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact | FixIt & Flow Website</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Outfit', sans-serif;
    padding: 2rem;
  }
  .card-wrapper {
    position: relative;
    border-radius: 28px;
    padding: 4px;
    background: linear-gradient(to left,#ff0000,#ff4500,#ff8c00,#ffd700,#adff2f,#00fa9a,#00bfff,#7b68ee,#ee82ee,#ff69b4);
    box-shadow: 0 0 0 3px #000, 0 0 40px 6px rgba(120,80,255,0.45), 0 0 80px 16px rgba(255,100,0,0.25);
    width: 420px;
    max-width: 100%;
  }
  .card {
    background: #0f0f0f;
    border-radius: 25px;
    overflow: hidden;
    position: relative;
  }
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg,transparent 30%,rgba(255,255,255,0.07) 50%,transparent 70%);
    pointer-events: none;
    z-index: 10;
  }
  .card-header {
    background: linear-gradient(to left,#ff0000,#ff4500,#ff8c00,#ffd700,#adff2f,#00fa9a,#00bfff,#7b68ee,#ee82ee,#ff69b4);
    padding: 4px 0 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .header-inner {
    background: #0f0f0f;
    width: 100%;
    padding: 2rem 2rem 1.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    border-radius: 0 0 20px 20px;
  }
  .avatar-ring {
    width: 96px; height: 96px;
    border-radius: 50%;
    padding: 3px;
    background: linear-gradient(to left,#ff4500,#ffd700,#00fa9a,#00bfff,#ee82ee);
    flex-shrink: 0;
  }
  .avatar-inner {
    width: 100%; height: 100%;
    border-radius: 50%;
    overflow: hidden;
    background: #000;
  }
  .avatar-inner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 50%;
  }
  .name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 34px;
    letter-spacing: 3px;
    line-height: 1;
    text-align: center;
    color: #fff;
    text-shadow: 0 0 8px rgba(255,255,255,0.9),1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,0 0 20px rgba(180,100,255,0.6),0 0 40px rgba(0,191,255,0.3);
  }
  .company {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    letter-spacing: 6px;
    background: linear-gradient(to left,#ff4500,#ffd700,#00fa9a,#00bfff,#ee82ee);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-align: center;
    margin-top: -4px;
  }
  .divider {
    width: 100%; height: 2px;
    background: linear-gradient(to left,#ff0000,#ff8c00,#ffd700,#adff2f,#00fa9a,#00bfff,#7b68ee,#ee82ee,#ff69b4);
  }
  .card-body {
    padding: 1.5rem 2rem 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .contact-row {
    display: flex;
    align-items: center;
    gap: 14px;
    text-decoration: none;
  }
  .icon-wrap {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1.5px solid;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .icon-wrap.phone { border-color: #ff4500; background: rgba(255,69,0,0.1); }
  .icon-wrap.email { border-color: #00bfff; background: rgba(0,191,255,0.1); }
  .icon-wrap.biz   { border-color: #adff2f; background: rgba(173,255,47,0.1); }
  .icon-wrap svg { width: 17px; height: 17px; }
  .icon-wrap.phone svg { stroke: #ff6030; }
  .icon-wrap.email svg { stroke: #00bfff; }
  .icon-wrap.biz   svg { stroke: #adff2f; }
  .contact-label {
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #555;
    line-height: 1;
    margin-bottom: 2px;
  }
  .contact-value {
    font-size: 15px;
    font-weight: 400;
    color: #fff;
    text-shadow: 0 0 6px rgba(255,255,255,0.5),1px 1px 0 #000;
    line-height: 1;
  }
  .qr-section {
    padding: 0 2rem 1.75rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .qr-label {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #444;
  }
  .qr-frame {
    padding: 3px;
    border-radius: 14px;
    background: linear-gradient(to left,#ff4500,#ffd700,#00fa9a,#00bfff,#ee82ee);
  }
  .qr-inner {
    background: #fff;
    border-radius: 12px;
    padding: 10px;
    display: flex;
  }
  .qr-inner img { display: block; width: 150px; height: 150px; }
  .card-footer {
    text-align: center;
    padding: 0 0 1.25rem;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #2a2a2a;
  }
  .site-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin: 0 2rem 1.2rem;
    min-height: 42px;
    border-radius: 12px;
    background: linear-gradient(to left,#ff4500,#ffd700,#00fa9a,#00bfff,#ee82ee);
    color: #000;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    text-decoration: none;
    text-transform: uppercase;
  }
</style>
</head>
